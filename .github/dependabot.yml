# تحديثات تلقائية (كطلبات دمج للمراجعة، لا تُدمج وحدها) لأدوات الاختبار وإجراءات GitHub
version: 2
updates:
  - package-ecosystem: npm
    directory: /qa
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
